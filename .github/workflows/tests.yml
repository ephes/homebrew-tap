name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae ephes/tap/jpegli

      - name: Run regression tests
        run: |
          # test-bot removes unchanged dependencies after testing. Restore them
          # and require an installed, working formula even if test-bot skipped it.
          brew install --only-dependencies ephes/tap/jpegli
          brew test ephes/tap/jpegli
          ruby_bin="$(brew ruby -rrbconfig -e 'puts RbConfig.ruby')"
          "$ruby_bin" -rrubygems/gem_runner -e 'Gem::GemRunner.new.run(ARGV)' -- \
            install --no-document --install-dir "$RUNNER_TEMP/test-gems" minitest --version 6.0.0
          GEM_PATH="$RUNNER_TEMP/test-gems" \
            JPEG_TURBO_BIN="$(brew --prefix jpeg-turbo)/bin" \
            JPEGLI_BIN="$(brew --prefix jpegli)/bin" \
            "$ruby_bin" test/validation_test.rb

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
